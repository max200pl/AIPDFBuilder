<html
  window-resizable
  window-frame="solid-with-shadow"
  window-width="900px"
  window-height="600px"
>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>AIPDFBuilder</title>
    <style src="shared/lib/tokens.css" />
    <style src="shared/lib/typography.css" />
    <style>
      html {
        background-color: var(--color-bg-workspace);
        color: var(--color-text-primary);
        font: 14px/1.4 system;
      }
      body {
        width: *;
        height: *;
        flow: vertical;
        padding: 0;
        margin: 0;
      }
    </style>
    <script type="module">
      // Window can't shrink below the design's base layout (window-width/height above
      // stay the initial/restore size; the host starts the window maximized).
      Window.this.minSize = [900, 600];

      // Ctrl+R — reload from source (dev convenience)
      document.on("keydown", function (evt) {
        if (evt.ctrlKey && evt.code === "KeyR") {
          Window.this.load(document.url());
          return true;
        }
      });

      // App bootstrap — mount the root shell (router wiring lives in app/App.js).
      // The dev-bridge boot is imported ONLY from a file:// document (the working tree: the e2e
      // runner, the storybook, a scapp preview). Evaluating it sets globalThis.__SDT_ALLOW_MOCK__ —
      // the host switch behind which each feature's _debug/ mock is installed AS that feature's
      // asset below. A packed build (this://app/) never takes this branch and packs no _debug/.
      import { App } from "./app/App.js";

      async function boot() {
        let bridge = null;
        if (String(document.url()).startsWith("file://")) {
          try { bridge = await import("../tools/dev-bridge/boot.js"); } catch (_) {}
        }
        // --- feature mock installs (guarded by the host switch) — one block per feature ---------
        // SDT:FEATURE-MOCKS:BEGIN
        // SDT:FEATURE-MOCKS:END
        document.body.content(<App />);
        if (bridge) bridge.attachDevBridge(document.$("#app")).catch(() => {});
      }
      boot();
    </script>
  </head>
  <body></body>
</html>
