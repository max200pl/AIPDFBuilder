    <style>
      :root {
        --bg: #f7f7f8;
        --panel: #ffffff;
        --border: #e2e3e5;
        --text: #1f2328;
        --muted: #6b7280;
        --accent: #2563eb;
        --status-done: #16a34a;
        --status-verified: #16a34a;
        --status-unverified: #d97706;
        --status-scanned-only: #6b7280;
        --status-stale: #b91c1c;
        --status-unknown: #9ca3af;
      }
      html { width:*; height:*; background: var(--bg); font: 13dip/1.4 system; color: var(--text); }
      body { margin:0; width:*; height:*; flow: vertical; }

      .caption { flow: horizontal; height: 38dip; background: var(--panel); border-bottom: 1dip solid var(--border); padding: 0 14dip; }
      .caption__lights { width: 78dip; }
      .caption__title { margin: * auto; font: 13dip system; font-weight: 600; color: var(--text); }
      .caption__count { margin: * 0; font-size: 11dip; color: var(--muted); padding-left: 8dip; }

      .main { width: *; height: *; flow: horizontal; }

      .sidebar { width: 280dip; height:*; flow: vertical; background: var(--panel); border-right: 1dip solid var(--border); }
      .sidebar__header { padding: 12dip; border-bottom: 1dip solid var(--border); flow: vertical; }
      .sidebar__title { font-weight: 600; padding-bottom: 6dip; }
      .sidebar__search { width: *; padding: 4dip 8dip; border: 1dip solid var(--border); border-radius: 4dip; font: 13dip system; }

      .sidebar__scroll { width: *; height: *; overflow-y: scroll-indicator; flow: vertical; }
      .sidebar__group-title { padding: 10dip 12dip 4dip; font-size: 10dip; font-weight: 600; text-transform: uppercase; color: var(--muted); letter-spacing: 0.5dip; }

      .sidebar__counts { font-size: 10dip; color: var(--muted); padding-bottom: 6dip; }
      .sidebar__sort { width: *; margin-top: 6dip; padding: 3dip 6dip; border: 1dip solid var(--border); border-radius: 4dip; font: 12dip system; }
      .badge-noprev { margin-left: 6dip; margin-top: *; margin-bottom: *; font-size: 9dip; color: var(--muted); border: 1dip solid var(--border); border-radius: 3dip; padding: 0 3dip; }
      .leaf--no-preview .sidebar__name { color: var(--muted); }
      .sidebar__tree { display: block; width: *; height: max-content; padding: 0 4dip 6dip; border: none; background: transparent; font: 13dip system; color: var(--text); }
      .sidebar__tree > option,
      .sidebar__tree option.node > option { display: block; width: *; }
      .sidebar__tree option > caption { flow: horizontal; padding: 4dip 6dip; width: *; }
      .sidebar__tree option > caption:hover { background: #eef0f3; cursor: pointer; }
      .sidebar__tree option:current > caption { background: #dbeafe; color: var(--accent); font-weight: 500; }
      /* Sciter sets :current on the ancestor folder path too — suppress
         that visual so only the actual leaf looks selected. */
      .sidebar__tree option.node:current > caption { background: transparent; color: inherit; font-weight: normal; }
      .sidebar__tree option.node:current > caption:hover { background: #eef0f3; }

      .sidebar__icon { width: 14dip; height: 14dip; margin-top: *; margin-bottom: *; margin-right: 6dip; }
      .sidebar__name { margin-top: *; margin-bottom: *; }

      .detail { width: *; height: *; flow: vertical; }
      .detail__header { padding: 16dip 20dip; border-bottom: 1dip solid var(--border); flow: vertical; background: var(--panel); }
      .detail__title { font: 18dip/1.2 system; font-weight: 600; padding-bottom: 6dip; }
      .detail__meta { flow: horizontal; font-size: 11dip; color: var(--muted); overflow: hidden; }
      .detail__meta > * { margin-right: 12dip; white-space: nowrap; }
      .detail__meta a { color: var(--accent); text-decoration: none; }
      .detail__desc { font-size: 12dip; padding-top: 8dip; color: var(--text); }
      .detail__mono { font: 11dip monospace; }
      .detail__canvas { width: *; height: *; background: var(--bg); padding: 24dip; overflow: scroll-indicator; }
      .detail__canvas-frame { width: *; height: *; border: 1dip solid var(--border); border-radius: 6dip; background: white; }
      .detail__empty { width: *; height: *; flow: vertical; text-align: center; color: var(--muted); font-size: 14dip; padding: 40dip; }

      .pill { display: inline-block; padding: 2dip 6dip; border-radius: 8dip; font-size: 10dip; font-weight: 500; background: var(--bg); border: 1dip solid var(--border); }
      .pill--done, .pill--verified { color: var(--status-done); border-color: var(--status-done); }
      .pill--unverified { color: var(--status-unverified); border-color: var(--status-unverified); }
      .pill--stale { color: var(--status-stale); border-color: var(--status-stale); }
      .pill--scanned-only { color: var(--status-scanned-only); border-color: var(--status-scanned-only); }
      .pill--unknown { color: var(--status-unknown); border-color: var(--status-unknown); }

      .story-tabs { flow: horizontal; border-bottom: 1dip solid var(--border); background: var(--panel); padding: 0 12dip; overflow-x: scroll-indicator; }
      .story-tabs__tab { padding: 8dip 16dip; color: var(--muted); font: 12dip/1 system; cursor: pointer; border-bottom: 2dip solid transparent; white-space: nowrap; }
      .story-tabs__tab:hover { color: var(--text); }
      .story-tabs__tab--active { color: var(--accent); font-weight: 500; border-bottom-color: var(--accent); }

      .welcome { width: *; height: *; flow: vertical; padding: 64dip 56dip 32dip 56dip; background: var(--bg); }
      .welcome__eyebrow { font-size: 11dip; font-weight: 600; text-transform: uppercase; letter-spacing: 1dip; color: var(--muted); }
      .welcome__title { font: 36dip/1.1 system; font-weight: 700; color: var(--text); padding-top: 8dip; }
      .welcome__lede { font-size: 14dip; line-height: 1.6; color: var(--muted); padding-top: 18dip; max-width: 560dip; }
      .welcome__hints { padding-top: 28dip; flow: vertical; }
      .welcome__hint { font-size: 12dip; color: var(--text); padding: 4dip 0; }
      .welcome__hint > span { color: var(--muted); padding-left: 6dip; }
      .welcome__footer { margin-top: *; font-size: 11dip; color: var(--muted); padding-top: 32dip; }
    </style>

            // No quotes around path — embedded quotes corrupt the path on Windows.
            const raw = href.replace(/^vscode:\/\/file\//i, "").replace(/%3A/gi, ":");
            try { sys.spawn(["cmd.exe", "/c", "code " + raw]); } catch (_) {}
          } else {
            try { launchURL(href); } catch (_) {}
          }
          return true;
        }

        _matchesFilter(name) {
          if (!this.filter) return true;
          return (name || "").toLowerCase().includes(this.filter);
        }
        _renderLeaf(name) {
          const c = BY_NAME[name];
          if (!c) return null;
          const status = c._status || "unknown";
          const noPrev = c._previewExists === false;   // GP-531: surface, don't hide
          return (
            <option key={name} name={name} value={name} class={noPrev ? "leaf--no-preview" : ""}>
              <caption>
                <img class="sidebar__icon" src={"data:image/svg+xml;utf8," + iconComponentFor(status)} />
                <span class="sidebar__name">{name}</span>
                {noPrev ? <span class="badge-noprev">no preview</span> : null}
              </caption>
            </option>
          );
        }
        _renderFolder(node) {
          const names = [node.name].concat(node.children || []);
          const visible = names.filter(n => this._matchesFilter(n));
          if (!visible.length) return null;
          const expanded = this.openFolders.has(node.name) ||
                           (this.filter && visible.length) ||
                           (this.active && visible.indexOf(this.active.name) >= 0);
          // Folder option has no `name`/`value` — clicks only expand/collapse.
          // Only the leaf <option>s inside trigger component selection.
          return (
            <option.node key={node.name} folder={node.name} expanded={!!expanded}>
              <caption>
                <img class="sidebar__icon" src={"data:image/svg+xml;utf8," + ICON_FOLDER} />
                <span class="sidebar__name">{node.name}</span>
              </caption>
              {visible.map(n => this._renderLeaf(n))}
            </option>
          );
        }
        _renderTreeNode(node) {
          if (node.children && node.children.length) return this._renderFolder(node);
          if (!this._matchesFilter(node.name)) return null;
          return this._renderLeaf(node.name);
        }
        renderSidebar() {
          const groups = TREE.filter(g => {
            return g.nodes.some(n => {
              if (n.children && n.children.length) {
                return [n.name].concat(n.children).some(nn => this._matchesFilter(nn));
              }
              return this._matchesFilter(n.name);
            });
          });
          const activeName = this.active ? (this.active._uid || this.active.name) : "";
          const groupHasActive = (g) => g.nodes.some(n =>
            n.name === activeName ||
            (n.children && n.children.indexOf(activeName) >= 0)
          );
          return (
            <div class="sidebar">
              <div class="sidebar__header">
                <div class="sidebar__counts">{COUNTS.total} components · {COUNTS.rendered} rendered · {COUNTS.ui_no_preview} no-preview</div>
                <input type="text" class="sidebar__search" placeholder="search…" value={this.filter || ""} oninput={(evt, el) => this.onSearch(evt, el)} />
                <select class="sidebar__sort" value={this.sortBy} onchange={(evt, el) => this.onSort(evt, el)}>
                  <option value="name">sort: name</option>
                  <option value="status">sort: status</option>
                  <option value="preview">sort: has preview</option>
                </select>
              </div>
              <div class="sidebar__scroll">
                {groups.map(g =>
                  <div key={"g:" + (g.slice ? "slice:" : "type:") + g.type}>
                    <div class={"sidebar__group-title" + (g._muted ? " sidebar__group-title--muted" : "")}>{g.type}</div>
                    <select|tree class="sidebar__tree" treelines value={groupHasActive(g) ? activeName : ""}>
                      {g.nodes.slice().sort((a, b) => _leafCmp(this.sortBy, a.name, b.name)).map(n => this._renderTreeNode(n)).filter(Boolean)}
                    </select>
                  </div>
                )}
              </div>
            </div>
          );
        }
        renderDetailHeader() {
          const c = this.active;
          if (!c) return <div class="detail__header"><div class="detail__title">Select a component</div></div>;
          const status = c._status || "unknown";
          return (
            <div class="detail__header">
              <div class="detail__title">{c._uid || c.name}</div>
              <div class="detail__meta">
                <span class={"pill pill--" + status}>{status}</span>
                {c.type     ? <span class="pill">{c.type}</span> : null}
                {c.frontend ? <span class="pill">{c.frontend}</span> : null}
                {c.layer    ? <span class="pill">{c.layer}</span> : null}
                {typeof c.ssim_score === "number" ? <span>SSIM {c.ssim_score.toFixed(3)}</span> : null}
                {c._figmaUrl ? <a href={c._figmaUrl}>Figma ↗</a> : null}
                {c.path ? <a href={vscodeUrlFor(c.path)} title={c.path}>VS Code ↗</a> : null}
              </div>
              {this.renderUsesLine(c)}
              {/* description is AI-facing only (component-creator reuse lookup) — NOT displayed in storybook */}
            </div>
          );
        }
        renderUsesLine(c) {
          // Revived dep-tree data (DEP_TREES anchor was dead after the
          // loadHtml-engine restore): one muted line of direct uses[].
          const t = DEP_TREES[c._uid || c.name];
          if (!t || !Array.isArray(t.children) || !t.children.length) return null;
          const parts = t.children.map(ch =>
            ch.name + (ch.children && ch.children.length ? " (+" + ch.children.length + ")" : ""));
          return <div style="font-size:8pt;color:#8a8a8a;margin-top:2dip">Uses: {parts.join(" · ")}</div>;
        }
        renderStoryTabs() {
          const c = this.active;
          if (!c || !Array.isArray(c._stories) || c._stories.length <= 1) return null;
          return (
            <div class="story-tabs">
              {c._stories.map(s =>
                <div class={"story-tabs__tab" + (s === this.activeStory ? " story-tabs__tab--active" : "")}
                     key={s} onclick={() => this.onSelectStory(s)}>{s}</div>
              )}
            </div>
          );
        }
        renderDetailCanvas() {
          const c = this.active;
          if (!c) return <div class="detail__canvas"><div class="detail__empty">Select a component from the sidebar.</div></div>;
          if (!c._previewExists) return <div class="detail__canvas"><div class="detail__empty">No preview file.</div></div>;
          return (
            <div class="detail__canvas">
              <frame id="canvas" class="detail__canvas-frame" />
            </div>
          );
        }
        renderWelcome() {
          return (
            <div class="welcome">
              <div class="welcome__eyebrow">Component catalog</div>
              <div class="welcome__title">Storybook</div>
              <div class="welcome__lede">
                A minimal visual catalog of every component registered in
                this project. Browse the tree on the left, open a leaf to
                preview it live. Folders group components by their parent
                primitive; the icon colour reflects verification status.
              </div>
              <div class="welcome__hints">
                <div class="welcome__hint">Click a component<span>load its preview</span></div>
                <div class="welcome__hint">Click a folder<span>expand or collapse</span></div>
                <div class="welcome__hint">Click the path<span>open the source file in VS Code</span></div>
                <div class="welcome__hint">Click Figma ↗<span>open the design reference in the browser</span></div>
              </div>
              <div class="welcome__footer">Made by Maksym Poskannyi · 2026</div>
            </div>
          );
        }
        renderCaption() {
          return (
            <header class="caption" role="window-caption">
              <span class="caption__lights" />
              <span class="caption__title">Storybook · {PROJECT_NAME}</span>
              <span class="caption__count">{REGISTRY.length} components</span>
            </header>
          );
        }
        // Defensive render wrapper (GP-531): one bad component/story must not blank or crash the
        // whole catalog. Every key render moment runs through this — on a throw it logs and returns
        // a safe fallback, so switching to a component with a malformed entry degrades to a local
        // "render error" placeholder instead of taking down the viewer.
        _safe(label, fn, fallback) {
          try { return fn(); }
          catch (e) {
            try { console.error("storybook: render[" + label + "] failed: " + e); } catch (_) {}
            _crumb("render[" + label + "] failed: " + e);
            return fallback;
          }
        }
        render() {
          try {
            return (
              <body>
                {this._safe("caption", () => this.renderCaption(), <header class="caption" role="window-caption" />)}
                <div class="main">
                  {this._safe("sidebar", () => this.renderSidebar(),
                    <div class="sidebar"><div class="sidebar__header"><div class="sidebar__counts">⚠ sidebar render error — see console</div></div></div>)}
                  <div class="detail">
                    {this.active ? this._safe("detail-header", () => this.renderDetailHeader(),
                      <div class="detail__header"><div class="detail__title">⚠ header render error</div></div>) : null}
                    {this.active ? this._safe("story-tabs", () => this.renderStoryTabs(), null) : null}
                    {this.active ? this._safe("detail-canvas", () => this.renderDetailCanvas(),
                      <div class="detail__canvas"><div class="detail__empty">⚠ Failed to render this component — see console. The rest of the catalog still works.</div></div>)
                     : this._safe("welcome", () => this.renderWelcome(), <div class="welcome" />)}
                  </div>
                </div>
              </body>
            );
          } catch (e) {
            try { console.error("storybook: render() failed: " + e); } catch (_) {}
            return (
              <body><div class="main"><div class="detail"><div class="detail__canvas">
                <div class="detail__empty">⚠ Storybook render error — see console.</div>
              </div></div></div></body>
            );
          }
        }
      }

      _crumb("catalog ready — " + REGISTRY.length + " entries");
      try { document.body.patch(<App />); }
      catch (e) { try { console.error("storybook: initial patch failed: " + e); } catch (_) {} _crumb("initial patch failed: " + e); }
    </script>
  </head>
  <body></body>
</html>
